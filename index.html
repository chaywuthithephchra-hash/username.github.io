<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEOPARD FREE PANEL</title>
    <style>
        body { background-color: #0a0a0a; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
        
        .panel { 
            width: 330px; 
            background-color: #000; 
            border: 2px solid #ffcc00; 
            border-radius: 10px; 
            padding: 15px; 
            box-shadow: 0 0 15px #ffcc0055; 
            color: white; 
        }

        h2 { color: #ffcc00; text-align: center; font-size: 18px; margin-bottom: 15px; text-shadow: 0 0 8px #ffcc00; }

        /* ส่วนของแถบเลือกเล็กๆ แบบ ZEUS */
        .select-box {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            margin-bottom: 15px;
            padding: 2px;
        }

        .label-text { font-size: 12px; color: #888; margin-left: 5px; margin-bottom: 3px; display: block; }

        select {
            width: 100%;
            background: transparent;
            color: white;
            border: none;
            padding: 5px;
            outline: none;
            font-size: 14px;
            cursor: pointer;
        }

        /* ไฮไลท์สีฟ้าตอนเลือกเหมือนในรูป */
        select option { background: #111; color: white; }
        select option:checked { background: #007bff !important; color: white; }

        /* ฟังก์ชันเดิมของพี่ทั้งหมด */
        .menu-item { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; padding: 5px 0; border-bottom: 1px solid #222; }
        .menu-item span { font-size: 14px; }

        /* ปุ่มสวิตช์เปิด-ปิด */
        .switch { position: relative; width: 34px; height: 18px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; background-color: #333; transition: .4s; border-radius: 20px; }
        .slider:before { position: absolute; content: ""; height: 12px; width: 12px; left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; }
        input:checked + .slider { background-color: #ff3300; }
        input:checked + .slider:before { transform: translateX(16px); }

        .btn-group { display: flex; gap: 8px; margin-top: 15px; }
        .btn { flex: 1; padding: 10px; border: 1px solid #ffcc00; background: transparent; color: white; border-radius: 5px; font-size: 12px; font-weight: bold; cursor: pointer; }
        
        .status { border: 1px solid #333; padding: 6px; margin-top: 15px; font-size: 11px; color: #777; }
        .status span { color: #ff3300; }
    </style>
</head>
<body>

<div class="panel">
    <h2>LEOPARD FREE PANEL</h2>

    <span class="label-text">เลือกรุ่นเครื่อง</span>
    <div class="select-box">
        <select>
            <option>กดเลือกตรงนี้</option>
            <option>Android</option>
            <option>IOS</option>
        </select>
    </div>

    <span class="label-text">เลือกโหมดดูดหัว</span>
    <div class="select-box">
        <select>
            <option>กดเลือกตรงนี้</option>
            <option>ดูดหัว</option>
            <option>ช่วยลาก</option>
        </select>
    </div>

    <div class="menu-item"><span>ดูดหัวแรง</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    <div class="menu-item"><span>กระสุนตรง</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    <div class="menu-item"><span>กันดำกันแบนหนาๆ</span><label class="switch"><input type="checkbox" checked><span class="slider"></span></label></div>
    <div class="menu-item"><span>บายพาส 1</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
    <div class="menu-item"><span>บายพาส 2</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>

    <div class="btn-group">
        <button class="btn">⚙️ AIMLOCK</button>
        <button class="btn">🎯 AIMBOT</button>
    </div>

    <div class="status">STATUS : <span>Waiting...</span></div>
</div>

</body>
  </html>
