<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>LEOPARD FREE PANEL</title>
    <style>
        body { 
            background-color: #0a0a0a; 
            margin: 0; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            min-height: 100vh; 
            font-family: sans-serif; 
        }
        
        /* พาแนลขอบนูนสีเหลือง */
        .panel { 
            width: 320px; 
            background-color: #000; 
            border: 2px solid #ffcc00; 
            border-radius: 12px; 
            padding: 18px; 
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.3); 
            color: white; 
        }

        h2 { 
            color: #ffcc00; 
            text-align: center; 
            font-size: 18px; 
            margin-bottom: 20px; 
            text-transform: uppercase;
            text-shadow: 0 0 5px #ffcc00;
        }

        /* แถบเลือกเล็กๆ สไตล์ ZEUS */
        .selection-container { margin-bottom: 15px; }
        .label-text { font-size: 12px; color: #777; margin-bottom: 4px; display: block; }

        .select-wrapper {
            background: #111;
            border: 1px solid #333;
            border-radius: 4px;
            padding: 2px;
        }

        select {
            width: 100%;
            background: transparent;
            color: white;
            border: none;
            padding: 6px;
            outline: none;
            font-size: 14px;
            cursor: pointer;
            -webkit-appearance: none; /* ลบลูกศรเดิมออกให้ดูคลีน */
        }

        /* ไฮไลท์สีฟ้าตอนกดเลือก (เฉพาะบางเบราว์เซอร์จะแสดงผลชัดเจน) */
        select option { background: #111; color: white; padding: 10px; }
        select option:checked { background-color: #007bff !important; color: white; }

        /* รายการฟังก์ชันเดิมของพี่ */
        .menu-list { margin-top: 10px; }
        .menu-item { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
            padding-bottom: 8px;
            border-bottom: 1px solid #1a1a1a;
        }
        .menu-item span { font-size: 14px; font-weight: 500; }

        /* ปุ่มสวิตช์ Toggle */
        .switch { position: relative; width: 38px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider { 
            position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0; 
            background-color: #333; transition: .4s; border-radius: 20px; 
        }
        .slider:before { 
            position: absolute; content: ""; height: 14px; width: 14px; 
            left: 3px; bottom: 3px; background-color: white; transition: .4s; border-radius: 50%; 
        }
        input:checked + .slider { background-color: #ff3300; } /* เปิดแล้วเป็นสีแดงตามต้นฉบับ */
        input:checked + .slider:before { transform: translateX(18px); }

        /* ปุ่มกดยิง/บายพาส */
        .btn-group { display: flex; gap: 10px; margin-top: 20px; }
        .btn { 
            flex: 1; 
            padding: 10px; 
            border: 1px solid #ffcc00; 
            background: transparent; 
            color: white; 
            border-radius: 4px; 
            font-size: 12px; 
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        .btn:active { background: #ffcc00; color: #000; }

        .footer-status { 
            margin-top: 15px; 
            padding: 8px; 
            border: 1px solid #222; 
            font-size: 11px; 
            color: #666; 
        }
        .footer-status span { color: #ff3300; font-weight: bold; }
    </style>
</head>
<body>

<div class="panel">
    <h2>LEOPARD FREE PANEL</h2>

    <div class="selection-container">
        <span class="label-text">ปรับระดับรุ่นเครื่อง</span>
        <div class="select-wrapper">
            <select>
                <option>เลือกรุ่นมือถือ</option>
                <option>Android</option>
                <option>IOS</option>
            </select>
        </div>
    </div>

    <div class="selection-container">
        <span class="label-text">ปรับระดับดูดหัว</span>
        <div class="select-wrapper">
            <select>
                <option>เลือกระดับงัดหัว</option>
                <option>ดูดหัว</option>
                <option>ช่วยลาก</option>
            </select>
        </div>
    </div>

    <div class="menu-list">
        <div class="menu-item"><span>ดูดหัวแรง</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
        <div class="menu-item"><span>กระสุนตรง</span><label class="switch"><input type="checkbox"><span class="slider"></span></label></div>
